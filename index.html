<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>デジタル診察券</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>


<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    "Meiryo",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #fff5fa,
      #f8f2ff
    );

  color: #333;

}


/* =========================
   メイン
========================= */

.container {

  width: 100%;
  max-width: 650px;

  min-height: 100vh;

  margin: 0 auto;

  padding:
    max(24px, env(safe-area-inset-top))
    18px
    max(30px, env(safe-area-inset-bottom))
    18px;

}


/* =========================
   カード
========================= */

.card {

  width: 100%;

  background: #fff;

  border:
    5px solid
    #e99ac0;

  border-radius: 28px;

  padding: 24px 20px 30px;

  box-shadow:
    0 10px 30px
    rgba(180, 90, 140, 0.12);

}


/* =========================
   医療機関名
========================= */

.hospital-name {

  text-align: center;

  color: #d34b8a;

  font-size:
    clamp(22px, 6vw, 34px);

  font-weight: 800;

  margin:
    4px 0 24px;

}


/* =========================
   説明
========================= */

.description {

  text-align: center;

  color: #777;

  font-size: 14px;

  line-height: 1.7;

  margin-bottom: 20px;

}


/* =========================
   ボタン
========================= */

button {

  width: 100%;

  border: none;

  border-radius: 14px;

  padding: 16px;

  margin-top: 10px;

  font-size: 17px;

  font-weight: 700;

  cursor: pointer;

  color: white;

  background:
    linear-gradient(
      135deg,
      #df5b9b,
      #a96ad7
    );

  box-shadow:
    0 5px 14px
    rgba(180, 90, 150, 0.22);

}

button:active {

  transform:
    scale(0.98);

}

button:disabled {

  background: #aaa;

  box-shadow: none;

}


/* =========================
   カメラ
========================= */

#cameraInput {

  display: none;

}


/* =========================
   プレビュー
========================= */

#preview {

  display: none;

  margin-top: 20px;

}

#previewImage {

  width: 100%;

  max-height: 60vh;

  object-fit: contain;

  display: block;

  border:
    2px solid
    #edbfd4;

  border-radius: 14px;

  background: #fafafa;

}


/* =========================
   ステータス
========================= */

#status {

  display: none;

  margin-top: 15px;

  padding: 13px;

  border-radius: 12px;

  background: #f7f7f7;

  color: #555;

  font-size: 14px;

  line-height: 1.6;

  white-space: pre-wrap;

}

.error {

  color: #b00020 !important;

  background: #fff0f2 !important;

}


/* =========================
   読み取り結果
========================= */

#result {

  display: none;

  margin-top: 24px;

}


/* =========================
   結果項目
========================= */

.result-box {

  border:
    2px solid
    #f0c2d7;

  border-radius: 16px;

  padding: 18px;

  margin-top: 14px;

  background:
    linear-gradient(
      135deg,
      #fff,
      #fff8fb
    );

}

.label {

  color: #777;

  font-size: 14px;

  margin-bottom: 7px;

}


/* =========================
   診察券番号
========================= */

#cardNumber {

  width: 100%;

  text-align: center;

  font-size:
    clamp(38px, 11vw, 72px);

  font-weight: 900;

  letter-spacing: 0.04em;

  color: #222;

  border:
    2px solid
    #e6b3cc;

  border-radius: 12px;

  padding: 10px;

  background: #fff;

}


/* =========================
   氏名
========================= */

#patientName {

  width: 100%;

  text-align: center;

  font-size:
    clamp(24px, 7vw, 42px);

  font-weight: 800;

  color: #9a4e82;

  border:
    2px solid
    #e6b3cc;

  border-radius: 12px;

  padding: 10px;

  background: #fff;

}


/* =========================
   入力欄
========================= */

input[type="text"] {

  width: 100%;

  border:
    2px solid
    #e4b5cb;

  border-radius: 12px;

  padding: 13px;

  font-size: 20px;

  text-align: center;

  outline: none;

}

input[type="text"]:focus {

  border-color:
    #c45b92;

  box-shadow:
    0 0 0 3px
    rgba(200, 90, 145, 0.12);

}


/* =========================
   QR
========================= */

#qrcode {

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 18px;

  margin-top: 10px;

  background: #fff;

  border-radius: 14px;

}

#qrcode canvas,
#qrcode img {

  width:
    min(75vw, 320px) !important;

  height:
    min(75vw, 320px) !important;

}


/* =========================
   保存ボタン
========================= */

#saveButton {

  margin-top: 20px;

  background:
    linear-gradient(
      135deg,
      #c85592,
      #8659c9
    );

}


/* =========================
   注意
========================= */

.note {

  margin-top: 10px;

  text-align: center;

  color: #888;

  font-size: 12px;

  line-height: 1.5;

}


/* =========================
   手動修正
========================= */

.manual-title {

  color: #a54b7f;

  font-weight: 700;

  font-size: 14px;

  margin-top: 16px;

  margin-bottom: 7px;

}


/* =========================
   スマホ
========================= */

@media (max-width: 480px) {

  .container {

    padding-left: 10px;
    padding-right: 10px;

  }

  .card {

    border-width: 4px;

    border-radius: 22px;

    padding:
      18px
      14px
      24px;

  }

}


/* =========================
   印刷
========================= */

@media print {

  body {

    background: white;

  }

  .description,
  button,
  #preview,
  #status,
  .manual-title,
  input {

    display: none !important;

  }

  .container {

    max-width: none;

    padding: 0;

  }

  .card {

    box-shadow: none;

  }

}

</style>

</head>


<body>


<main class="container">

<section class="card">


<div class="hospital-name">
  綱島ゆめみ産婦人科
</div>


<div class="description">

診察券を明るい場所で、
券面全体が入るように撮影してください。

</div>


<button
  type="button"
  id="cameraButton"
>

診察券を撮影する

</button>


<input
  id="cameraInput"
  type="file"
  accept="image/*"
  capture="environment"
>


<div id="preview">

<img
  id="previewImage"
  alt="撮影した診察券"
>

<button
  id="processButton"
  type="button"
>

診察券を読み取る

</button>

</div>


<div id="status"></div>


<div id="result">


<!-- ======================
     診察券番号
====================== -->

<div class="result-box">

<div class="label">
診察券番号
</div>

<div
  id="cardNumber"
>
</div>


<div class="manual-title">
診察券番号を手動で修正
</div>

<input
  id="manualNumber"
  type="text"
  inputmode="numeric"
  autocomplete="off"
  placeholder="数字のみ入力"
>


<button
  id="updateNumberButton"
  type="button"
>

診察券番号を更新

</button>

</div>



<!-- ======================
     氏名
====================== -->

<div class="result-box">

<div class="label">
氏名
</div>

<div
  id="patientName"
>
</div>


<div class="manual-title">
氏名を手動で修正
</div>

<input
  id="manualName"
  type="text"
  autocomplete="name"
  placeholder="氏名を入力"
>


<button
  id="updateNameButton"
  type="button"
>

氏名を更新

</button>

</div>



<!-- ======================
     QR
====================== -->

<div class="result-box">

<div class="label">
診察券番号QRコード
</div>

<div id="qrcode"></div>

</div>



<!-- ======================
     保存
====================== -->

<button
  id="saveButton"
  type="button"
>

📱 写真に保存

</button>


</div>


</section>

</main>



<script>


/* ==========================================
   共通
========================================== */

const $ =
  id =>
    document.getElementById(id);


let selectedFile = null;

let currentNumber = "";

let currentName = "";



/* ==========================================
   カメラ
========================================== */

$("cameraButton").addEventListener(
  "click",
  function () {

    $("cameraInput").click();

  }
);



$("cameraInput").addEventListener(
  "change",
  function (event) {

    const file =
      event.target.files[0];

    if (!file) return;

    selectedFile = file;

    $("previewImage").src =
      URL.createObjectURL(file);

    $("preview").style.display =
      "block";

    $("result").style.display =
      "none";

    $("status").style.display =
      "none";

  }
);



/* ==========================================
   ステータス
========================================== */

function setStatus(
  message,
  isError = false
) {

  const el =
    $("status");

  el.style.display =
    "block";

  el.className =
    isError
      ? "error"
      : "";

  el.textContent =
    message;

}



/* ==========================================
   数字だけにする
========================================== */

function normalizeDigits(text) {

  return String(text || "")
    .replace(/[^0-9]/g, "");

}



/* ==========================================
   画像読み込み
========================================== */

function loadImage(file) {

  return new Promise(
    function (resolve, reject) {

      const img =
        new Image();

      const url =
        URL.createObjectURL(file);

      img.onload =
        function () {

          URL.revokeObjectURL(url);

          resolve(img);

        };

      img.onerror =
        function () {

          URL.revokeObjectURL(url);

          reject(
            new Error(
              "画像を読み込めませんでした。"
            )
          );

        };

      img.src =
        url;

    }
  );

}



/* ==========================================
   Canvas
========================================== */

function canvasFromImage(
  img,
  maxSide = 2000
) {

  const scale =
    Math.min(
      1,
      maxSide /
      Math.max(
        img.naturalWidth,
        img.naturalHeight
      )
    );

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width =
    Math.max(
      1,
      Math.round(
        img.naturalWidth * scale
      )
    );

  canvas.height =
    Math.max(
      1,
      Math.round(
        img.naturalHeight * scale
      )
    );

  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );

  ctx.imageSmoothingEnabled =
    true;

  ctx.imageSmoothingQuality =
    "high";

  ctx.drawImage(
    img,
    0,
    0,
    canvas.width,
    canvas.height
  );

  return canvas;

}



/* ==========================================
   回転
========================================== */

function rotateCanvas(
  source,
  angle
) {

  if (angle === 0) {

    return source;

  }

  const rad =
    angle *
    Math.PI /
    180;

  const swap =
    angle === 90 ||
    angle === 270;

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width =
    swap
      ? source.height
      : source.width;

  canvas.height =
    swap
      ? source.width
      : source.height;

  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );

  ctx.translate(
    canvas.width / 2,
    canvas.height / 2
  );

  ctx.rotate(rad);

  ctx.drawImage(
    source,
    -source.width / 2,
    -source.height / 2
  );

  return canvas;

}



/* ==========================================
   QR候補画像
========================================== */

function makeVariants(source) {

  const variants = [];

  const angles =
    [0, 90, 180, 270];

  for (
    const angle of angles
  ) {

    const canvas =
      rotateCanvas(
        source,
        angle
      );

    variants.push({
      canvas,
      label:
        `回転${angle}°`
    });

  }

  return variants;

}



/* ==========================================
   QRスキャン
========================================== */

function scanOneCanvas(
  canvas
) {

  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );

  const imageData =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

  const code =
    jsQR(
      imageData.data,
      imageData.width,
      imageData.height,
      {
        inversionAttempts:
          "attemptBoth"
      }
    );

  return code;

}



/* ==========================================
   QRコード取得
========================================== */

async function scanQRCode(img) {

  const base =
    canvasFromImage(
      img,
      2200
    );

  const variants =
    makeVariants(base);

  let count = 0;

  for (
    const variant of variants
  ) {

    count++;

    setStatus(
      "QRコードを探しています…\n" +
      count +
      "/" +
      variants.length
    );

    const code =
      scanOneCanvas(
        variant.canvas
      );

    if (code) {

      return {
        code,
        canvas:
          variant.canvas
      };

    }

  }

  return null;

}



/* ==========================================
   OCR用氏名処理
========================================== */

function cleanName(text) {

  return String(text || "")

    .replace(
      /\r/g,
      "\n"
    )

    .split("\n")

    .map(
      s => s.trim()
    )

    .filter(Boolean)

    .join(" ")

    .replace(
      /[0-9０-９]/g,
      ""
    )

    .replace(
      /[|｜_＿~～]/g,
      ""
    )

    .replace(
      /\s+/g,
      " "
    )

    .trim();

}



/* ==========================================
   氏名領域
========================================== */

function cropNameArea(
  canvas,
  qr
) {

  const points =
    qr.location;

  const topLeft =
    points.topLeftCorner;

  const topRight =
    points.topRightCorner;

  const bottomLeft =
    points.bottomLeftCorner;

  const qrWidth =
    Math.max(
      Math.hypot(
        topRight.x -
        topLeft.x,

        topRight.y -
        topLeft.y
      ),

      Math.hypot(
        bottomLeft.x -
        topLeft.x,

        bottomLeft.y -
        topLeft.y
      )
    );


  /*
   * 診察券サンプルでは
   *
   * QRコード
   * ↓
   * 診察券番号
   * ↓
   * 氏名
   *
   * の配置を想定
   */


  const qrRight =
    Math.max(
      points.topRightCorner.x,
      points.bottomRightCorner.x
    );


  const qrTop =
    Math.min(
      points.topLeftCorner.y,
      points.topRightCorner.y
    );


  const x =
    Math.round(
      qrRight +
      qrWidth * 0.12
    );


  const y =
    Math.round(
      qrTop +
      qrWidth * 0.85
    );


  const width =
    Math.min(
      canvas.width - x,
      Math.round(
        qrWidth * 3.2
      )
    );


  const height =
    Math.min(
      canvas.height - y,
      Math.round(
        qrWidth * 1.8
      )
    );


  if (
    width < 100 ||
    height < 60
  ) {

    throw new Error(
      "氏名領域を検出できませんでした。"
    );

  }


  const output =
    document.createElement(
      "canvas"
    );

  output.width =
    width;

  output.height =
    height;


  const ctx =
    output.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );


  ctx.drawImage(
    canvas,

    x,
    y,
    width,
    height,

    0,
    0,
    width,
    height
  );


  return output;

}



/* ==========================================
   OCR画像拡大
========================================== */

function preprocessNameCanvas(
  source
) {

  const scale =
    4;

  const output =
    document.createElement(
      "canvas"
    );

  output.width =
    source.width *
    scale;

  output.height =
    source.height *
    scale;


  const ctx =
    output.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );


  ctx.imageSmoothingEnabled =
    true;

  ctx.imageSmoothingQuality =
    "high";


  ctx.drawImage(
    source,

    0,
    0,

    output.width,
    output.height
  );


  return output;

}



/* ==========================================
   OCR
========================================== */

async function recognizeName(
  canvas
) {

  let worker;

  try {

    worker =
      await Tesseract.createWorker(
        "jpn",
        1,
        {
          logger:
            function (message) {

              if (
                message.status
              ) {

                const progress =
                  typeof message.progress ===
                  "number"

                    ? " " +
                      Math.round(
                        message.progress *
                        100
                      ) +
                      "%"

                    : "";

                setStatus(
                  "氏名をOCRで読み取っています…\n" +
                  message.status +
                  progress
                );

              }

            }
        }
      );


    await worker.setParameters({

      tessedit_pageseg_mode:
        "7",

      preserve_interword_spaces:
        "1"

    });


    const result =
      await worker.recognize(
        canvas
      );


    return cleanName(
      result.data.text
    );

  }
  finally {

    if (worker) {

      await worker.terminate();

    }

  }

}



/* ==========================================
   QR生成
========================================== */

function generateQRCode(
  cardNumber
) {

  const target =
    $("qrcode");

  target.innerHTML =
    "";


  new QRCode(
    target,
    {

      text:
        normalizeDigits(
          cardNumber
        ),

      width:
        320,

      height:
        320,

      colorDark:
        "#000000",

      colorLight:
        "#ffffff",

      correctLevel:
        QRCode.CorrectLevel.H

    }
  );

}



/* ==========================================
   読み取り
========================================== */

$("processButton").addEventListener(
  "click",
  processCard
);



async function processCard() {

  if (!selectedFile) {

    alert(
      "診察券を撮影してください。"
    );

    return;

  }


  const button =
    $("processButton");

  button.disabled =
    true;


  $("result").style.display =
    "none";


  try {

    setStatus(
      "診察券の画像を読み込んでいます…"
    );


    const img =
      await loadImage(
        selectedFile
      );


    setStatus(
      "QRコードを探しています…\n" +
      "診察券の向きを自動的に確認します。"
    );


    const qrResult =
      await scanQRCode(
        img
      );


    if (!qrResult) {

      throw new Error(
        "診察券のQRコードを読み取れませんでした。\n\n" +
        "診察券全体が写っているか確認して、もう一度お試しください。"
      );

    }


    /*
     * QRの内容から
     * 数字だけを抽出
     */

    const cardNumber =
      normalizeDigits(
        qrResult.code.data
      );


    if (!cardNumber) {

      throw new Error(
        "QRコードは検出できましたが、診察券番号を取得できませんでした。"
      );

    }


    currentNumber =
      cardNumber;


    $("cardNumber").textContent =
      cardNumber;

    $("manualNumber").value =
      cardNumber;


    setStatus(
      "診察券番号を取得しました。\n" +
      "番号：" +
      cardNumber +
      "\n\n" +
      "氏名を読み取っています…"
    );


    let patientName =
      "";


    /*
     * 氏名OCR
     */

    try {

      const nameArea =
        preprocessNameCanvas(
          cropNameArea(
            qrResult.canvas,
            qrResult.code
          )
        );


      patientName =
        await recognizeName(
          nameArea
        );

    }
    catch (error) {

      console.log(
        "氏名OCR:",
        error
      );

    }


    currentName =
      patientName;


    $("patientName").textContent =
      patientName ||
      "氏名を入力してください";

    $("manualName").value =
      patientName;


    /*
     * QR再生成
     */

    generateQRCode(
      currentNumber
    );


    $("result").style.display =
      "block";


    setStatus(
      "読み取りが完了しました。\n\n" +

      "診察券番号：" +
      currentNumber +

      "\n" +

      (
        currentName
          ? "氏名：" +
            currentName
          : "氏名：手動確認が必要です。"
      )
    );

  }
  catch (error) {

    console.error(
      error
    );


    setStatus(
      error.message ||
      "読み取り中にエラーが発生しました。",
      true
    );

  }
  finally {

    button.disabled =
      false;

  }

}



/* ==========================================
   診察券番号手動更新
========================================== */

$("updateNumberButton").addEventListener(
  "click",
  function () {

    const number =
      normalizeDigits(
        $("manualNumber").value
      );


    if (!number) {

      alert(
        "診察券番号を入力してください。"
      );

      return;

    }


    currentNumber =
      number;


    $("cardNumber").textContent =
      number;


    $("manualNumber").value =
      number;


    /*
     * 手動修正した番号で
     * QRコードを再生成
     */

    generateQRCode(
      number
    );


    setStatus(
      "診察券番号を更新しました。\n" +
      "番号：" +
      number
    );

  }
);



/* ==========================================
   氏名手動更新
========================================== */

$("updateNameButton").addEventListener(
  "click",
  function () {

    const name =
      $("manualName")
        .value
        .trim();


    if (!name) {

      alert(
        "氏名を入力してください。"
      );

      return;

    }


    currentName =
      name;


    $("patientName").textContent =
      name;


    $("manualName").value =
      name;


    setStatus(
      "氏名を更新しました。\n" +
      "氏名：" +
      name
    );

  }
);



/* ==========================================
   保存
========================================== */

$("saveButton").addEventListener(
  "click",
  async function () {

    try {

      const number =
        $("cardNumber")
          .textContent
          .trim();


      const name =
        $("patientName")
          .textContent
          .trim();


      if (
        !number ||
        !name ||
        name ===
        "氏名を入力してください"
      ) {

        alert(
          "診察券番号と氏名を確認してください。"
        );

        return;

      }


      /*
       * =====================================
       * 高解像度保存
       *
       * 1440 × 1920
       * =====================================
       */

      const canvas =
        document.createElement(
          "canvas"
        );


      const width =
        1440;

      const height =
        1920;


      canvas.width =
        width;

      canvas.height =
        height;


      const ctx =
        canvas.getContext(
          "2d"
        );


      /* =====================================
         背景
      ===================================== */

      const gradient =
        ctx.createLinearGradient(
          0,
          0,
          width,
          height
        );


      gradient.addColorStop(
        0,
        "#ffffff"
      );


      gradient.addColorStop(
        1,
        "#fff2f8"
      );


      ctx.fillStyle =
        gradient;


      ctx.fillRect(
        0,
        0,
        width,
        height
      );


      /* =====================================
         ピンク枠
      ===================================== */

      ctx.strokeStyle =
        "#e989b7";


      ctx.lineWidth =
        20;


      ctx.beginPath();


      ctx.roundRect(
        35,
        35,
        width - 70,
        height - 70,
        55
      );


      ctx.stroke();


      /* =====================================
         医療機関名
      ===================================== */

      ctx.textAlign =
        "center";


      ctx.fillStyle =
        "#d3478b";


      ctx.font =
        "bold 66px sans-serif";


      ctx.fillText(
        "綱島ゆめみ産婦人科",
        width / 2,
        155
      );


      /* =====================================
         診察券番号ラベル
      ===================================== */

      ctx.fillStyle =
        "#777";


      ctx.font =
        "34px sans-serif";


      ctx.fillText(
        "診察券番号",
        width / 2,
        315
      );


      /* =====================================
         診察券番号
         
         ★大きなサイズを維持
      ===================================== */

      ctx.fillStyle =
        "#222";


      ctx.font =
        "bold 145px sans-serif";


      ctx.fillText(
        number,
        width / 2,
        485
      );


      /* =====================================
         氏名ラベル
      ===================================== */

      ctx.fillStyle =
        "#b44a83";


      ctx.font =
        "bold 36px sans-serif";


      ctx.fillText(
        "氏名",
        width / 2,
        590
      );


      /* =====================================
         氏名
      ===================================== */

      ctx.fillStyle =
        "#8e4b79";


      let nameFontSize =
        76;


      if (
        name.length >= 10
      ) {

        nameFontSize =
          62;

      }


      if (
        name.length >= 14
      ) {

        nameFontSize =
          52;

      }


      ctx.font =
        "bold " +
        nameFontSize +
        "px sans-serif";


      ctx.fillText(
        name,
        width / 2,
        690
      );


      /* =====================================
         QRコード
      ===================================== */

      const qrCanvas =
        $("qrcode")
          .querySelector(
            "canvas"
          );


      if (qrCanvas) {

        const qrSize =
          620;


        const qrX =
          (width -
            qrSize) /
          2;


        const qrY =
          810;


        /*
         * 白背景
         */

        ctx.fillStyle =
          "#ffffff";


        ctx.fillRect(
          qrX - 20,
          qrY - 20,
          qrSize + 40,
          qrSize + 40
        );


        ctx.drawImage(
          qrCanvas,
          qrX,
          qrY,
          qrSize,
          qrSize
        );

      }


      /*
       * =====================================
       * ここには説明文を入れません
       *
       * 「診察券番号の数字のみを格納しています」
       * は完全に削除しています。
       * =====================================
       */


      /* =====================================
         PNG生成
      ===================================== */

      const blob =
        await new Promise(
          function (resolve) {

            canvas.toBlob(
              resolve,
              "image/png",
              1.0
            );

          }
        );


      if (!blob) {

        throw new Error(
          "画像を作成できませんでした。"
        );

      }


      /* =====================================
         スマートフォン共有
      ===================================== */

      const file =
        new File(
          [blob],
          "綱島ゆめみ産婦人科_デジタル診察券.png",
          {
            type:
              "image/png"
          }
        );


      if (
        navigator.share &&
        navigator.canShare &&
        navigator.canShare(
          {
            files:
              [file]
          }
        )
      ) {

        await navigator.share(
          {

            title:
              "綱島ゆめみ産婦人科 デジタル診察券",

            text:
              "デジタル診察券",

            files:
              [file]

          }
        );


        return;

      }


      /* =====================================
         PC・非対応端末
      ===================================== */

      const url =
        URL.createObjectURL(
          blob
        );


      const a =
        document.createElement(
          "a"
        );


      a.href =
        url;


      a.download =
        "綱島ゆめみ産婦人科_デジタル診察券.png";


      document.body.appendChild(
        a
      );


      a.click();


      a.remove();


      setTimeout(
        function () {

          URL.revokeObjectURL(
            url
          );

        },
        1000
      );


    }
    catch (error) {

      console.error(
        error
      );


      /*
       * 共有画面を
       * ユーザーが閉じた場合
       */

      if (
        error &&
        error.name ===
        "AbortError"
      ) {

        return;

      }


      alert(
        "診察券画像を保存できませんでした。\n" +
        "もう一度お試しください。"
      );

    }

  }
);

</script>

</body>
</html>
