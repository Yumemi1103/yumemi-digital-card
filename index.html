<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>デジタル診察券｜綱島ゆめみ産婦人科</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  background: #fff7fb;
  color: #333;
}

body {
  min-height: 100vh;
}

/* ==========================================
   読み取り画面
========================================== */

.setup {
  width: 100%;
  max-width: 600px;
  min-height: 100vh;
  margin: 0 auto;

  padding:
    max(25px, env(safe-area-inset-top))
    18px
    max(35px, env(safe-area-inset-bottom));

  background: #fff;
}

h1 {
  margin: 10px 0 5px;
  text-align: center;
  font-size: 25px;
}

.clinic-name {
  text-align: center;
  color: #d14c91;
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 25px;
}

.panel {
  border: 1px solid #f0c5dc;
  border-radius: 18px;
  padding: 20px;
  background: #fff;
}

.description {
  text-align: center;
  color: #666;
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 20px;
}

button {
  width: 100%;
  min-height: 52px;
  margin-top: 10px;

  border: 0;
  border-radius: 12px;

  background:
    linear-gradient(
      135deg,
      #e85c9d,
      #9b65c8
    );

  color: white;
  font-size: 16px;
  font-weight: 700;

  cursor: pointer;
}

button:disabled {
  background: #aaa;
}

.gray-button {
  background: #666;
}

#cameraInput {
  display: none;
}

#preview {
  display: none;
  margin-top: 18px;
}

#previewImage {
  display: block;
  width: 100%;
  max-height: 55vh;
  object-fit: contain;

  border: 1px solid #e5bfd4;
  border-radius: 12px;
}

#status {
  display: none;

  margin-top: 16px;
  padding: 13px;

  border-radius: 10px;

  background: #fff1f8;

  color: #a04070;

  font-size: 14px;
  line-height: 1.6;

  white-space: pre-line;
}

#status.error {
  background: #fff0f0;
  color: #b00020;
}

#status.warning {
  background: #fff8e8;
  color: #805500;
}

#confirmation {
  display: none;
  margin-top: 20px;
}

.result-box {
  margin-top: 14px;
  padding: 15px;

  border: 1px solid #e8c4d8;
  border-radius: 12px;

  background: #fff;
}

.label {
  margin-bottom: 7px;

  color: #777;

  font-size: 13px;
  font-weight: 600;
}

.auto-number {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: .08em;
}

input {
  width: 100%;
  min-height: 52px;

  padding: 10px 13px;

  border:
    1px solid #d9a9c3;

  border-radius: 9px;

  font-size: 20px;

  background: #fff;
}

input:focus {
  outline:
    3px solid rgba(232,92,157,.15);

  border-color: #d95796;
}

.help {
  margin-top: 6px;

  color: #777;

  font-size: 12px;
  line-height: 1.6;
}

.privacy {
  margin-top: 18px;

  padding: 12px;

  border-radius: 10px;

  background: #faf4f8;

  color: #777;

  font-size: 12px;

  line-height: 1.6;
}


/* ==========================================
   デジタル診察券
========================================== */

#digitalCard {

  display: none;

  width: 100%;
  min-height: 100vh;

  padding:
    max(20px, env(safe-area-inset-top))
    15px
    max(20px, env(safe-area-inset-bottom));

  background:
    linear-gradient(
      145deg,
      #fff,
      #fff4fa
    );

  flex-direction: column;
  align-items: center;

  text-align: center;
}


/*
   実際の診察券表示エリア
*/

.card-display {

  width: 100%;
  max-width: 650px;

  min-height:
    calc(
      100vh - 40px
    );

  padding:
    25px 18px 22px;

  border:
    5px solid #e989b7;

  border-radius: 28px;

  background: #fff;

  box-shadow:
    0 6px 25px
    rgba(160,70,120,.15);

  display: flex;

  flex-direction: column;

  align-items: center;
}


/*
   医療機関名
*/

.final-clinic-name {

  width: 100%;

  color: #d3478b;

  font-size:
    clamp(
      22px,
      6vw,
      34px
    );

  font-weight: 800;

  letter-spacing: .03em;
}


/*
   診察券番号
*/

.final-number-label {

  margin-top:
    clamp(
      25px,
      5vh,
      55px
    );

  color: #777;

  font-size: 15px;
}

#finalNumber {

  margin-top: 4px;

  color: #333;

  font-size:
    clamp(
      52px,
      16vw,
      90px
    );

  line-height: 1.1;

  font-weight: 800;

  letter-spacing: .08em;

  font-variant-numeric:
    tabular-nums;
}


/*
   氏名
*/

.final-name-label {

  margin-top:
    clamp(
      18px,
      3vh,
      30px
    );

  color: #b44a83;

  font-size: 15px;

  font-weight: 700;
}

#finalName {

  margin-top: 4px;

  color: #8e4b79;

  font-size:
    clamp(
      27px,
      7vw,
      43px
    );

  font-weight: 800;

  word-break: break-word;
}


/*
   QRコード
*/

.qr-area {

  width: 100%;

  margin-top: auto;

  padding-top: 20px;
}

#finalQr {

  display: flex;

  justify-content: center;
  align-items: center;

  width:
    min(
      70vw,
      300px
    );

  height:
    min(
      70vw,
      300px
    );

  margin: 0 auto;

  padding: 10px;

  background: #fff;

  border:
    2px solid #f0c0d8;

  border-radius: 15px;

  box-shadow:
    0 3px 15px
    rgba(0,0,0,.10);
}

#finalQr img,
#finalQr canvas {

  width: 100% !important;
  height: 100% !important;
}

.qr-note {

  margin-top: 8px;

  color: #999;

  font-size: 10px;
}


/*
   保存ボタン
*/

#saveButton {

  width:
    min(
      100%,
      360px
    );

  margin-top: 16px;
}


/*
   戻る
*/

#restartButton {

  width:
    min(
      100%,
      360px
    );

  margin-top: 8px;

  background: #777;
}

</style>
</head>

<body>


<!-- ==========================================
     読み取り画面
========================================== -->

<main id="setup" class="setup">

<h1>
デジタル診察券
</h1>

<div class="clinic-name">
綱島ゆめみ産婦人科
</div>


<section class="panel">

<div class="description">

診察券全体が入るように撮影してください。<br>

明るい場所で撮影すると、
より読み取りやすくなります。

</div>


<button
id="cameraButton"
type="button">

診察券を撮影する

</button>


<input
id="cameraInput"
type="file"
accept="image/*"
capture="environment"
>


<div id="preview">

<img
id="previewImage"
alt="撮影した診察券"
>


<button
id="readButton"
type="button">

診察券を読み取る

</button>

</div>


<div
id="status"
role="status"
aria-live="polite">
</div>


<!-- 確認画面 -->

<section id="confirmation">


<div class="result-box">

<div class="label">
自動取得した診察券番号
</div>

<div
id="autoNumber"
class="auto-number">
-
</div>

<div class="help">
自動取得した番号です。
必ず診察券の数字と確認してください。
</div>

</div>


<div class="result-box">

<div class="label">
診察券番号（確認・修正）
</div>

<input
id="numberInput"
type="text"
inputmode="numeric"
autocomplete="off"
maxlength="20"
placeholder="診察券番号"
>

<div class="help">
数字のみ入力できます。
間違っている場合は直接修正してください。
</div>

</div>


<div class="result-box">

<div class="label">
氏名
</div>

<input
id="nameInput"
type="text"
autocomplete="name"
placeholder="例：綱島 夢子"
>

<div class="help">
氏名は自動認識を試みますが、
間違っている場合は直接修正してください。
</div>

</div>


<button
id="completeButton"
type="button">

確認してデジタル診察券を表示

</button>


</section>


<div class="privacy">

<strong>
個人情報について
</strong>

<br>

撮影した画像はサーバーへ送信しません。
診察券番号の読み取りは端末のブラウザ内で行います。

</div>

</section>

</main>


<!-- ==========================================
     デジタル診察券
========================================== -->

<main id="digitalCard">


<section
id="cardDisplay"
class="card-display">


<div class="final-clinic-name">

綱島ゆめみ産婦人科

</div>


<div class="final-number-label">

診察券番号

</div>


<div id="finalNumber">
</div>


<div class="final-name-label">

氏名

</div>


<div id="finalName">
</div>


<div class="qr-area">

<div
id="finalQr">
</div>


<div class="qr-note">

診察券番号の数字のみを格納しています

</div>

</div>


<button
id="saveButton"
type="button">

📱 この診察券を端末に保存

</button>


<button
id="restartButton"
type="button">

別の診察券を読み取る

</button>


</section>

</main>


<script>

"use strict";


/* ==========================================
   基本変数
========================================== */

let selectedFile = null;

let imageUrl = "";

let detectedNumber = "";


/* ==========================================
   要素
========================================== */

const $ =
id => document.getElementById(id);


/* ==========================================
   ステータス
========================================== */

function showStatus(
message,
type = ""
){

const status =
$("status");

status.style.display =
"block";

status.className =
"status";

if(type){

status.classList.add(
type
);

}

status.textContent =
message;

}


function hideStatus(){

$("status").style.display =
"none";

$("status").textContent =
"";

}


/* ==========================================
   数字だけ
========================================== */

function onlyDigits(text){

return String(
text || ""
)

.replace(
/[０-９]/g,
function(char){

return String.fromCharCode(
char.charCodeAt(0) - 65248
);

}
)

.replace(
/[^0-9]/g,
""
);

}


/* ==========================================
   カメラ
========================================== */

$("cameraButton")
.addEventListener(
"click",
function(){

$("cameraInput").click();

}
);


/* ==========================================
   写真
========================================== */

$("cameraInput")
.addEventListener(
"change",
function(event){

const file =
event.target.files &&
event.target.files[0];

if(!file){

return;

}

selectedFile =
file;


if(imageUrl){

URL.revokeObjectURL(
imageUrl
);

}


imageUrl =
URL.createObjectURL(
file
);


$("previewImage").src =
imageUrl;


$("preview").style.display =
"block";


$("confirmation").style.display =
"none";


hideStatus();

}
);


/* ==========================================
   画像
========================================== */

function loadImage(){

return new Promise(
function(resolve,reject){

const img =
new Image();

img.onload =
function(){

resolve(img);

};

img.onerror =
function(){

reject(
new Error(
"画像を読み込めませんでした。"
)
);

};

img.src =
imageUrl;

}
);

}


/* ==========================================
   Canvas
========================================== */

function createCanvas(
img,
maxSize = 1600
){

const width =
img.naturalWidth ||
img.width;

const height =
img.naturalHeight ||
img.height;


const scale =
Math.min(
1,
maxSize /
Math.max(
width,
height
)
);


const canvas =
document.createElement(
"canvas"
);


canvas.width =
Math.max(
1,
Math.round(
width * scale
)
);


canvas.height =
Math.max(
1,
Math.round(
height * scale
)
);


const ctx =
canvas.getContext(
"2d",
{
willReadFrequently:true
}
);


ctx.imageSmoothingEnabled =
true;


ctx.imageSmoothingQuality =
"high";


ctx.drawImage(
img,
0,
0,
canvas.width,
canvas.height
);


return canvas;

}


/* ==========================================
   QR
========================================== */

function readQR(canvas){

if(
typeof jsQR ===
"undefined"
){

return null;

}


const ctx =
canvas.getContext(
"2d",
{
willReadFrequently:true
}
);


const imageData =
ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);


return jsQR(
imageData.data,
imageData.width,
imageData.height,
{
inversionAttempts:
"attemptBoth"
}
);

}


/* ==========================================
   QR回転
========================================== */

function scanQRCode(
canvas
){

const angles =
[
0,
90,
180,
270
];


for(
const angle of angles
){

let target =
canvas;


if(
angle !== 0
){

target =
document.createElement(
"canvas"
);


const swap =
angle === 90 ||
angle === 270;


target.width =
swap
? canvas.height
: canvas.width;


target.height =
swap
? canvas.width
: canvas.height;


const ctx =
target.getContext(
"2d"
);


ctx.translate(
target.width / 2,
target.height / 2
);


ctx.rotate(
angle * Math.PI / 180
);


ctx.drawImage(
canvas,
-canvas.width / 2,
-canvas.height / 2
);

}


const result =
readQR(
target
);


if(result){

return result;

}

}


return null;

}


/* ==========================================
   氏名OCR
   Tesseractを必要時だけ読み込む
========================================== */

async function loadTesseract(){

if(
window.Tesseract
){

return window.Tesseract;

}


await new Promise(
function(resolve,reject){

const script =
document.createElement(
"script"
);

script.src =
"https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";


script.onload =
resolve;


script.onerror =
function(){

reject(
new Error(
"氏名OCRを読み込めませんでした。"
)
);

};


document.head.appendChild(
script
);

}
);


return window.Tesseract;

}


/* ==========================================
   氏名OCR
   診察券番号の直下付近を重点的に読む
========================================== */

async function recognizeName(
img
){

try{

const Tesseract =
await loadTesseract();


const canvas =
createCanvas(
img,
1800
);


/*
   診察券の中央付近を中心に
   複数パターンで氏名を探します。
*/

const regions = [

{
x:0.20,
y:0.25,
w:0.75,
h:0.35
},

{
x:0.10,
y:0.20,
w:0.85,
h:0.45
},

{
x:0.25,
y:0.30,
w:0.70,
h:0.30
}

];


const worker =
await Tesseract.createWorker(
"jpn",
1,
{
logger:function(message){

if(
message.status &&
typeof message.progress ===
"number"
){

showStatus(
"氏名を確認しています…\n" +
Math.round(
message.progress * 100
) +
"%"
);

}

}
}
);


try{

await worker.setParameters({

tessedit_pageseg_mode:
"6"

});


for(
const region of regions
){

const crop =
document.createElement(
"canvas"
);


crop.width =
Math.round(
canvas.width *
region.w
);


crop.height =
Math.round(
canvas.height *
region.h
);


const ctx =
crop.getContext(
"2d"
);


ctx.drawImage(

canvas,

Math.round(
canvas.width *
region.x
),

Math.round(
canvas.height *
region.y
),

crop.width,
crop.height,

0,
0,

crop.width,
crop.height

);


const result =
await worker.recognize(
crop
);


let text =
result &&
result.data &&
result.data.text
? result.data.text
: "";


/*
   改行・記号などを整理
*/

text =
text
.replace(
/[0-9０-９]/g,
""
)
.replace(
/[\r\n]+/g,
" "
)
.replace(
/[|｜_＿~～]/g,
""
)
.replace(
/\s+/g,
" "
)
.trim();


/*
   明らかに氏名らしい文字列だけ採用
*/

if(
text.length >= 2 &&
text.length <= 20
){

return text;

}

}


return "";

}
finally{

await worker.terminate();

}

}
catch(error){

console.log(
"Name OCR:",
error
);

return "";

}

}


/* ==========================================
   読み取り
========================================== */

$("readButton")
.addEventListener(
"click",
async function(){

if(!selectedFile){

showStatus(
"診察券を撮影してください。",
"error"
);

return;

}


const button =
$("readButton");

button.disabled =
true;


try{

const img =
await loadImage();


showStatus(
"診察券を確認しています…"
);


const canvas =
createCanvas(
img,
1600
);


/*
   まずQR
*/

const qr =
scanQRCode(
canvas
);


if(qr){

const number =
onlyDigits(
qr.data
);


if(number){

detectedNumber =
number;


$("autoNumber").textContent =
number;


$("numberInput").value =
number;

}

}


/*
   QRがない場合
*/

if(
!detectedNumber
){

showStatus(
"QRコードを読み取れませんでした。\n" +
"診察券の数字を確認しています…",
"warning"
);


/*
   今回は番号OCRも実施
*/

try{

const Tesseract =
await loadTesseract();


const worker =
await Tesseract.createWorker(
"eng",
1
);


await worker.setParameters({

tessedit_char_whitelist:
"0123456789",

tessedit_pageseg_mode:
"6"

});


const result =
await worker.recognize(
canvas
);


const text =
result.data.text || "";


const candidates =
text.match(
/\d{3,12}/g
) || [];


if(candidates.length){

detectedNumber =
onlyDigits(
candidates[0]
);

$("autoNumber").textContent =
detectedNumber;

$("numberInput").value =
detectedNumber;

}


await worker.terminate();

}
catch(error){

console.log(
"OCR:",
error
);

}

}


/*
   氏名OCR
*/

showStatus(
"氏名を確認しています…"
);


const name =
await recognizeName(
img
);


if(name){

$("nameInput").value =
name;

showStatus(
"読み取りが完了しました。\n" +
"診察券番号と氏名を必ず確認してください。"
);

}
else{

showStatus(
"氏名を自動認識できませんでした。\n" +
"下の欄に氏名を入力してください。",
"warning"
);

}


/*
   確認画面
*/

$("confirmation").style.display =
"block";


setTimeout(
function(){

$("numberInput").focus();

},
300
);


}
catch(error){

console.error(
error
);

showStatus(
error.message ||
"読み取り中にエラーが発生しました。",
"error"
);

}
finally{

button.disabled =
false;

}

}
);


/* ==========================================
   番号入力
========================================== */

$("numberInput")
.addEventListener(
"input",
function(){

this.value =
onlyDigits(
this.value
);

}
);


/* ==========================================
   デジタル診察券表示
========================================== */

$("completeButton")
.addEventListener(
"click",
function(){

const number =
onlyDigits(
$("numberInput").value
);


const name =
$("nameInput").value.trim();


if(!number){

showStatus(
"診察券番号を入力してください。",
"error"
);

$("numberInput").focus();

return;

}


if(!name){

showStatus(
"氏名を入力してください。",
"error"
);

$("nameInput").focus();

return;

}


/*
   最終表示
*/

$("finalNumber").textContent =
number;

$("finalName").textContent =
name;


/*
   QR生成
*/

const qrContainer =
$("finalQr");


qrContainer.innerHTML =
"";


const qrSize =
Math.min(
300,
Math.max(
190,
Math.floor(
window.innerWidth *
0.70
)
)
);


new QRCode(
qrContainer,
{

text:number,

width:qrSize,

height:qrSize,

colorDark:"#000000",

colorLight:"#ffffff",

correctLevel:
QRCode.CorrectLevel.H

}
);


/*
   画面切替
*/

$("setup").style.display =
"none";


$("digitalCard").style.display =
"flex";


window.scrollTo(
0,
0
);

}
);


/* ==========================================
   デジタル診察券を画像として保存
========================================== */

$("saveButton")
.addEventListener(
"click",
async function(){

try{

const number =
$("finalNumber").textContent;

const name =
$("finalName").textContent;


/*
   Canvasを作成
*/

const canvas =
document.createElement(
"canvas"
);


const width =
1080;

const height =
1600;


canvas.width =
width;

canvas.height =
height;


const ctx =
canvas.getContext(
"2d"
);


/*
   背景
*/

const gradient =
ctx.createLinearGradient(
0,
0,
width,
height
);


gradient.addColorStop(
0,
"#ffffff"
);


gradient.addColorStop(
1,
"#fff2f8"
);


ctx.fillStyle =
gradient;


ctx.fillRect(
0,
0,
width,
height
);


/*
   外枠
*/

ctx.strokeStyle =
"#e989b7";


ctx.lineWidth =
18;


ctx.beginPath();


ctx.roundRect(
30,
30,
width - 60,
height - 60,
45
);


ctx.stroke();


/*
   医療機関名
*/

ctx.fillStyle =
"#d3478b";


ctx.textAlign =
"center";


ctx.font =
"bold 58px sans-serif";


ctx.fillText(
"綱島ゆめみ産婦人科",
width / 2,
145
);


/*
   診察券番号ラベル
*/

ctx.fillStyle =
"#777";


ctx.font =
"32px sans-serif";


ctx.fillText(
"診察券番号",
width / 2,
290
);


/*
   番号
*/

ctx.fillStyle =
"#333";


ctx.font =
"bold 105px sans-serif";


ctx.fillText(
number,
width / 2,
410
);


/*
   氏名ラベル
*/

ctx.fillStyle =
"#b44a83";


ctx.font =
"bold 32px sans-serif";


ctx.fillText(
"氏名",
width / 2,
505
);


/*
   氏名
*/

ctx.fillStyle =
"#8e4b79";


ctx.font =
"bold 58px sans-serif";


ctx.fillText(
name,
width / 2,
590
);


/*
   QRをCanvasにコピー
*/

const qrCanvas =
$("finalQr")
.querySelector("canvas");


if(qrCanvas){

ctx.drawImage(
qrCanvas,
240,
700,
600,
600
);

}


/*
   PNG
*/

const blob =
await new Promise(
function(resolve){

canvas.toBlob(
resolve,
"image/png"
);

}
);


if(!blob){

throw new Error(
"画像を作成できませんでした。"
);

}


const file =
new File(
[blob],
"綱島ゆめみ産婦人科_デジタル診察券.png",
{
type:"image/png"
}
);


/*
   スマホ共有機能
*/

if(
navigator.share &&
navigator.canShare &&
navigator.canShare(
{
files:[file]
}
)
){

await navigator.share(
{
title:
"綱島ゆめみ産婦人科 デジタル診察券",

text:
"デジタル診察券",

files:[file]
}
);

}
else{

/*
   PC・非対応スマホ
*/

const url =
URL.createObjectURL(
blob
);


const a =
document.createElement(
"a"
);


a.href =
url;


a.download =
"綱島ゆめみ産婦人科_デジタル診察券.png";


document.body.appendChild(
a
);


a.click();


a.remove();


URL.revokeObjectURL(
url
);

}

}
catch(error){

console.error(
error
);

alert(
"保存できませんでした。\n" +
"お使いの端末の共有・保存機能を確認してください。"
);

}

}
);


/* ==========================================
   最初に戻る
========================================== */

$("restartButton")
.addEventListener(
"click",
function(){

selectedFile =
null;

detectedNumber =
"";


$("cameraInput").value =
"";


$("preview").style.display =
"none";


$("confirmation").style.display =
"none";


$("numberInput").value =
"";


$("nameInput").value =
"";


$("autoNumber").textContent =
"-";


$("digitalCard").style.display =
"none";


$("setup").style.display =
"block";


$("finalQr").innerHTML =
"";


hideStatus();


if(imageUrl){

URL.revokeObjectURL(
imageUrl
);

imageUrl =
"";

}


window.scrollTo(
0,
0
);

}
);

</script>

</body>
</html>
