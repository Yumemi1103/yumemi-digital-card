<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,user-scalable=no">

<title>デジタル診察券</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    sans-serif;
  color:#333;
}

body{
  min-height:100vh;
}

.container{
  width:100%;
  max-width:600px;
  min-height:100vh;
  margin:0 auto;
  padding:20px 16px 30px;
}

.title{
  text-align:center;
  color:#d94c91;
  font-size:22px;
  font-weight:800;
  margin:5px 0 18px;
}

.card{
  width:100%;
  border:4px solid #e78ab8;
  border-radius:20px;
  padding:22px 18px 25px;
  background:#fff;
  box-shadow:0 3px 12px rgba(200,80,140,.12);
}

.description{
  text-align:center;
  color:#666;
  font-size:14px;
  line-height:1.7;
  margin-bottom:18px;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px 12px;
  margin-top:10px;
  font-size:16px;
  font-weight:700;
  color:#fff;
  background:#d94c91;
}

button:disabled{
  background:#aaa;
}

.secondary{
  background:#8c5aa9;
}

#cameraInput{
  display:none;
}

#preview{
  display:none;
  margin-top:18px;
}

#previewImage{
  display:block;
  width:100%;
  max-height:55vh;
  object-fit:contain;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fafafa;
}

#status{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#f5f5f5;
  color:#555;
  font-size:14px;
  line-height:1.6;
  white-space:pre-wrap;
}

.error{
  color:#b00020 !important;
  background:#fff0f3 !important;
}

#result{
  display:none;
  margin-top:20px;
}

/* ==============================
   完成したデジタル診察券
   ============================== */

.digital-card{
  width:100%;
  min-height:70vh;
  border:5px solid #e78ab8;
  border-radius:22px;
  padding:25px 18px 28px;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.hospital-name{
  width:100%;
  text-align:center;
  color:#d94c91;
  font-size:23px;
  font-weight:800;
  margin-bottom:20px;
}

.number-label{
  color:#777;
  font-size:13px;
  margin-bottom:4px;
}

.card-number{
  color:#7c4a91;
  font-size:46px;
  line-height:1.1;
  font-weight:900;
  letter-spacing:2px;
  text-align:center;
  word-break:break-all;
  margin-bottom:20px;
}

.name-label{
  color:#777;
  font-size:13px;
  margin-bottom:4px;
}

.patient-name{
  color:#d94c91;
  font-size:28px;
  line-height:1.3;
  font-weight:800;
  text-align:center;
  margin-bottom:25px;
  min-height:38px;
  word-break:break-word;
}

.qr-label{
  color:#777;
  font-size:13px;
  margin-bottom:8px;
}

#qrcode{
  width:280px;
  height:280px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  padding:10px;
}

#qrcode canvas,
#qrcode img{
  width:260px !important;
  height:260px !important;
}

.manual-area{
  margin-top:20px;
  width:100%;
}

.manual-area label{
  display:block;
  font-size:13px;
  color:#666;
  margin-bottom:6px;
}

.manual-area input{
  width:100%;
  padding:13px;
  border:2px solid #e2a3c3;
  border-radius:10px;
  font-size:18px;
  text-align:center;
  outline:none;
}

.manual-area input:focus{
  border-color:#d94c91;
}

.save-button{
  background:#8c5aa9;
  margin-top:18px;
}

.retry-button{
  background:#777;
}

.note{
  text-align:center;
  color:#888;
  font-size:12px;
  line-height:1.6;
  margin-top:10px;
}

/* 保存用画像 */
#saveCanvas{
  display:none;
}

@media(max-width:390px){

  .container{
    padding:12px 10px 20px;
  }

  .card{
    padding:18px 12px 20px;
  }

  .digital-card{
    padding:20px 12px 24px;
  }

  .card-number{
    font-size:40px;
  }

  .patient-name{
    font-size:25px;
  }

  #qrcode{
    width:250px;
    height:250px;
  }

  #qrcode canvas,
  #qrcode img{
    width:230px !important;
    height:230px !important;
  }
}

</style>
</head>

<body>

<main class="container">

  <div class="title">
    綱島ゆめみ産婦人科
  </div>

  <!-- 撮影画面 -->

  <section class="card" id="inputCard">

    <div class="description">
      診察券全体が写るように撮影してください。<br>
      QRコードから診察券番号を取得します。
    </div>

    <button
      type="button"
      onclick="openCamera()">
      診察券を撮影する
    </button>

    <input
      id="cameraInput"
      type="file"
      accept="image/*"
      capture="environment"
      onchange="handlePhoto(event)">

    <div id="preview">

      <img
        id="previewImage"
        alt="撮影した診察券">

      <button
        id="processButton"
        type="button"
        onclick="processCard()">
        診察券を読み取る
      </button>

    </div>

    <div id="status"></div>

  </section>


  <!-- 完成したデジタル診察券 -->

  <section id="result">

    <div class="digital-card" id="digitalCard">

      <div class="hospital-name">
        綱島ゆめみ産婦人科
      </div>

      <div class="number-label">
        診察券番号
      </div>

      <div
        id="cardNumber"
        class="card-number">
      </div>

      <div class="name-label">
        お名前
      </div>

      <div
        id="patientName"
        class="patient-name">
      </div>

      <div class="qr-label">
        診察券番号QRコード
      </div>

      <div id="qrcode"></div>

    </div>


    <!-- お名前の手動修正 -->

    <div class="manual-area">

      <label for="manualName">
        お名前が正しくない場合は修正してください
      </label>

      <input
        id="manualName"
        type="text"
        placeholder="お名前を入力">

      <button
        type="button"
        class="secondary"
        onclick="applyManualName()">
        お名前を修正する
      </button>

    </div>


    <!-- 診察券番号の手動修正 -->

    <div class="manual-area">

      <label for="manualNumber">
        診察券番号が違う場合は数字のみ入力してください
      </label>

      <input
        id="manualNumber"
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        placeholder="診察券番号">

      <button
        type="button"
        class="secondary"
        onclick="applyManualNumber()">
        診察券番号を修正する
      </button>

    </div>


    <button
      type="button"
      class="save-button"
      onclick="saveDigitalCard()">
      デジタル診察券を保存する
    </button>

    <button
      type="button"
      class="retry-button"
      onclick="resetApp()">
      別の診察券を読み取る
    </button>

    <div class="note">
      保存ボタンを押すと高画質の診察券画像を作成します。<br>
      端末によっては「写真に保存」または「共有」から保存してください。
    </div>

  </section>

</main>


<canvas id="saveCanvas"></canvas>


<script>

let selectedFile = null;


/* ==============================
   基本処理
   ============================== */

function openCamera(){

  document
    .getElementById("cameraInput")
    .click();

}


function handlePhoto(event){

  const file =
    event.target.files[0];

  if(!file) return;

  selectedFile = file;

  const url =
    URL.createObjectURL(file);

  document
    .getElementById("previewImage")
    .src = url;

  document
    .getElementById("preview")
    .style.display = "block";

  document
    .getElementById("result")
    .style.display = "none";

  document
    .getElementById("status")
    .style.display = "none";

}


function setStatus(message,isError=false){

  const el =
    document.getElementById("status");

  el.style.display = "block";

  el.className =
    isError ? "error" : "";

  el.textContent = message;

}


function normalizeDigits(text){

  return String(text || "")
    .replace(/[^0-9]/g,"");

}


/* ==============================
   画像読み込み
   ============================== */

function loadImage(file){

  return new Promise((resolve,reject)=>{

    const img = new Image();

    const url =
      URL.createObjectURL(file);

    img.onload = ()=>{

      URL.revokeObjectURL(url);

      resolve(img);

    };

    img.onerror = ()=>{

      URL.revokeObjectURL(url);

      reject(
        new Error(
          "画像を読み込めませんでした。"
        )
      );

    };

    img.src = url;

  });

}


function canvasFromImage(
  img,
  maxSide=1800
){

  const scale =
    Math.min(
      1,
      maxSide /
      Math.max(
        img.naturalWidth,
        img.naturalHeight
      )
    );

  const c =
    document.createElement("canvas");

  c.width =
    Math.max(
      1,
      Math.round(
        img.naturalWidth * scale
      )
    );

  c.height =
    Math.max(
      1,
      Math.round(
        img.naturalHeight * scale
      )
    );

  const ctx =
    c.getContext(
      "2d",
      {willReadFrequently:true}
    );

  ctx.imageSmoothingEnabled = true;

  ctx.imageSmoothingQuality = "high";

  ctx.drawImage(
    img,
    0,
    0,
    c.width,
    c.height
  );

  return c;

}


/* ==============================
   回転
   ============================== */

function rotateCanvas(
  source,
  angle
){

  if(angle === 0)
    return source;

  const rad =
    angle * Math.PI / 180;

  const swap =
    angle === 90 ||
    angle === 270;

  const c =
    document.createElement("canvas");

  c.width =
    swap
      ? source.height
      : source.width;

  c.height =
    swap
      ? source.width
      : source.height;

  const ctx =
    c.getContext(
      "2d",
      {willReadFrequently:true}
    );

  ctx.translate(
    c.width / 2,
    c.height / 2
  );

  ctx.rotate(rad);

  ctx.drawImage(
    source,
    -source.width / 2,
    -source.height / 2
  );

  return c;

}


/* ==============================
   QR検索用バリエーション
   ============================== */

function makeVariants(source){

  const variants = [];

  const angles =
    [0,90,180,270];

  for(const angle of angles){

    const c =
      rotateCanvas(
        source,
        angle
      );

    variants.push({
      canvas:c,
      label:`回転${angle}°`
    });


    const w = c.width;
    const h = c.height;

    const crops = [

      [
        0,
        0,
        Math.round(w*0.7),
        Math.round(h*0.7),
        "左上"
      ],

      [
        Math.round(w*0.3),
        0,
        w,
        Math.round(h*0.7),
        "右上"
      ],

      [
        0,
        Math.round(h*0.3),
        Math.round(w*0.7),
        h,
        "左下"
      ],

      [
        Math.round(w*0.3),
        Math.round(h*0.3),
        w,
        h,
        "右下"
      ]

    ];


    for(
      const [
        x1,
        y1,
        x2,
        y2,
        label
      ] of crops
    ){

      const cw =
        x2 - x1;

      const ch =
        y2 - y1;

      const crop =
        document.createElement(
          "canvas"
        );

      crop.width = cw;
      crop.height = ch;

      const ctx =
        crop.getContext(
          "2d",
          {willReadFrequently:true}
        );

      ctx.drawImage(
        c,
        x1,
        y1,
        cw,
        ch,
        0,
        0,
        cw,
        ch
      );

      variants.push({
        canvas:crop,
        label:
          `回転${angle}°・${label}`
      });

    }

  }

  return variants;

}


/* ==============================
   QR用画像処理
   ============================== */

function makeProcessedCanvas(
  source,
  mode
){

  const c =
    document.createElement("canvas");

  c.width = source.width;
  c.height = source.height;

  const ctx =
    c.getContext(
      "2d",
      {willReadFrequently:true}
    );

  ctx.drawImage(
    source,
    0,
    0
  );

  const data =
    ctx.getImageData(
      0,
      0,
      c.width,
      c.height
    );

  const d =
    data.data;

  for(
    let i=0;
    i<d.length;
    i+=4
  ){

    const gray =
      0.299*d[i] +
      0.587*d[i+1] +
      0.114*d[i+2];

    if(mode === "gray"){

      d[i] =
      d[i+1] =
      d[i+2] =
      gray;

    }

    else if(mode === "contrast"){

      const v =
        Math.max(
          0,
          Math.min(
            255,
            (gray-128)*1.8+128
          )
        );

      d[i] =
      d[i+1] =
      d[i+2] =
      v;

    }

  }

  ctx.putImageData(
    data,
    0,
    0
  );

  return c;

}


/* ==============================
   QR読み取り
   ============================== */

function scanOneCanvas(canvas){

  const modes =
    [
      "normal",
      "gray",
      "contrast"
    ];

  for(
    const mode of modes
  ){

    const target =
      mode === "normal"
        ? canvas
        : makeProcessedCanvas(
            canvas,
            mode
          );

    const ctx =
      target.getContext(
        "2d",
        {willReadFrequently:true}
      );

    const imageData =
      ctx.getImageData(
        0,
        0,
        target.width,
        target.height
      );

    const code =
      jsQR(
        imageData.data,
        imageData.width,
        imageData.height,
        {
          inversionAttempts:
            "attemptBoth"
        }
      );

    if(code){

      return {
        code:code,
        canvas:target
      };

    }

  }

  return null;

}


async function scanQRCode(img){

  const base =
    canvasFromImage(
      img,
      1800
    );

  const variants =
    makeVariants(base);

  let count = 0;

  for(
    const v of variants
  ){

    count++;

    if(count % 5 === 0){

      setStatus(
        `QRコードを探しています…\n${count}/${variants.length}`
      );

    }

    const found =
      scanOneCanvas(
        v.canvas
      );

    if(found){

      return {
        data:found.code.data,
        canvas:v.canvas,
        code:found.code,
        method:"jsQR"
      };

    }

  }

  return null;

}


/* ==============================
   お名前領域
   ============================== */

function cleanName(text){

  return String(text || "")
    .replace(/\r/g,"\n")
    .split("\n")
    .map(
      s => s.trim()
    )
    .filter(Boolean)
    .join(" ")
    .replace(/[0-9０-９]/g,"")
    .replace(
      /[|｜_＿~～]/g,
      ""
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();

}


function cropNameArea(
  canvas,
  qr
){

  const tl =
    qr.location.topLeftCorner;

  const tr =
    qr.location.topRightCorner;

  const bl =
    qr.location.bottomLeftCorner;

  const qrW =
    Math.max(
      Math.hypot(
        tr.x-tl.x,
        tr.y-tl.y
      ),
      Math.hypot(
        bl.x-tl.x,
        bl.y-tl.y
      )
    );

  const qrRight =
    Math.max(
      qr.location.topRightCorner.x,
      qr.location.bottomRightCorner.x
    );

  const qrTop =
    Math.min(
      qr.location.topLeftCorner.y,
      qr.location.topRightCorner.y
    );

  const qrBottom =
    Math.max(
      qr.location.bottomLeftCorner.y,
      qr.location.bottomRightCorner.y
    );

  const x =
    Math.round(
      qrRight + qrW*0.15
    );

  const y =
    Math.round(
      qrTop + qrW*0.95
    );

  const width =
    Math.min(
      canvas.width-x,
      Math.round(qrW*2.8)
    );

  const height =
    Math.min(
      canvas.height-y,
      Math.round(qrW*1.25)
    );

  if(
    width < 100 ||
    height < 60
  ){

    throw new Error(
      "お名前領域を検出できませんでした。"
    );

  }

  const out =
    document.createElement(
      "canvas"
    );

  out.width = width;
  out.height = height;

  const ctx =
    out.getContext(
      "2d",
      {willReadFrequently:true}
    );

  ctx.drawImage(
    canvas,
    x,
    y,
    width,
    height,
    0,
    0,
    width,
    height
  );

  return out;

}


function preprocessNameCanvas(
  source
){

  const scale = 3;

  const out =
    document.createElement(
      "canvas"
    );

  out.width =
    source.width * scale;

  out.height =
    source.height * scale;

  const ctx =
    out.getContext(
      "2d",
      {willReadFrequently:true}
    );

  ctx.imageSmoothingEnabled = true;

  ctx.imageSmoothingQuality =
    "high";

  ctx.drawImage(
    source,
    0,
    0,
    out.width,
    out.height
  );

  return out;

}


async function recognizeName(
  canvas
){

  const worker =
    await Tesseract.createWorker(
      "jpn",
      1,
      {
        logger:m=>{

          if(m.status){

            let p =
              typeof m.progress === "number"
                ? " " +
                  Math.round(
                    m.progress*100
                  ) +
                  "%"
                : "";

            setStatus(
              "お名前をOCRで読み取っています…\n" +
              m.status +
              p
            );

          }

        }
      }
    );

  await worker.setParameters({
    tessedit_pageseg_mode:"7"
  });

  const result =
    await worker.recognize(
      canvas
    );

  const name =
    cleanName(
      result.data.text
    );

  await worker.terminate();

  return name;

}


/* ==============================
   QR再生成
   ============================== */

function generateQRCode(
  cardNumber
){

  const target =
    document.getElementById(
      "qrcode"
    );

  target.innerHTML = "";

  new QRCode(
    target,
    {
      text:cardNumber,
      width:260,
      height:260,
      colorDark:"#000000",
      colorLight:"#ffffff",
      correctLevel:
        QRCode.CorrectLevel.H
    }
  );

}


/* ==============================
   読み取り本体
   ============================== */

async function processCard(){

  if(!selectedFile){

    alert(
      "診察券を撮影してください。"
    );

    return;

  }

  const button =
    document.getElementById(
      "processButton"
    );

  button.disabled = true;

  try{

    setStatus(
      "診察券の画像を読み込んでいます…"
    );

    const img =
      await loadImage(
        selectedFile
      );

    setStatus(
      "QRコードを探しています…\n" +
      "診察券の向きを変えながら自動検索します。"
    );

    const qrResult =
      await scanQRCode(img);

    if(!qrResult){

      throw new Error(
        "診察券のQRコードを読み取れませんでした。\n" +
        "診察券全体が写るように、もう一度撮影してください。"
      );

    }

    const cardNumber =
      normalizeDigits(
        qrResult.data
      );

    if(!cardNumber){

      throw new Error(
        "QRコードから診察券番号を取得できませんでした。"
      );

    }


    setStatus(
      "診察券番号を取得しました。\n" +
      "番号：" +
      cardNumber +
      "\n\nお名前を読み取っています…"
    );


    let patientName = "";


    if(
      qrResult.code &&
      qrResult.canvas
    ){

      try{

        const nameArea =
          preprocessNameCanvas(
            cropNameArea(
              qrResult.canvas,
              qrResult.code
            )
          );

        patientName =
          await recognizeName(
            nameArea
          );

      }catch(e){

        console.log(
          "name OCR:",
          e
        );

      }

    }


    document
      .getElementById(
        "cardNumber"
      )
      .textContent =
      cardNumber;


    document
      .getElementById(
        "patientName"
      )
      .textContent =
      patientName ||
      "お名前を入力してください";


    document
      .getElementById(
        "manualName"
      )
      .value =
      patientName || "";


    document
      .getElementById(
        "manualNumber"
      )
      .value =
      cardNumber;


    generateQRCode(
      cardNumber
    );


    document
      .getElementById(
        "inputCard"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "result"
      )
      .style.display =
      "block";


    setStatus(
      "読み取りが完了しました。\n" +
      "必要に応じてお名前・診察券番号を手動で修正してください。"
    );

  }
  catch(error){

    console.error(error);

    setStatus(
      error.message ||
      "読み取り中にエラーが発生しました。",
      true
    );

  }
  finally{

    button.disabled = false;

  }

}

/* ==============================
   保存用画像作成
   ============================== */

function createSaveCanvas(){

  const scale = 3;

  const width = 1200;
  const height = 1800;

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width = width;
  canvas.height = height;

  const ctx =
    canvas.getContext("2d");

  /* 白背景 */

  ctx.fillStyle = "#ffffff";

  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  /* ピンク枠 */

  ctx.strokeStyle =
    "#e78ab8";

  ctx.lineWidth = 18;

  ctx.strokeRect(
    18,
    18,
    width-36,
    height-36
  );


  /* 病院名 */

  ctx.textAlign = "center";

  ctx.fillStyle =
    "#d94c91";

  ctx.font =
    "bold 64px sans-serif";

  ctx.fillText(
    "綱島ゆめみ産婦人科",
    width/2,
    150
  );


  /* 診察券番号 */

  ctx.fillStyle =
    "#777";

  ctx.font =
    "32px sans-serif";

  ctx.fillText(
    "診察券番号",
    width/2,
    260
  );


  const number =
    document
      .getElementById(
        "cardNumber"
      )
      .textContent
      .trim();

  ctx.fillStyle =
    "#7c4a91";

  ctx.font =
    "bold 120px sans-serif";

  ctx.fillText(
    number,
    width/2,
    390
  );


  /* お名前 */

  ctx.fillStyle =
    "#777";

  ctx.font =
    "32px sans-serif";

  ctx.fillText(
    "お名前",
    width/2,
    500
  );


  const name =
    document
      .getElementById(
        "patientName"
      )
      .textContent
      .trim();

  ctx.fillStyle =
    "#d94c91";

  ctx.font =
    "bold 72px sans-serif";

  ctx.fillText(
    name,
    width/2,
    620
  );


  /* QR */

  const qrCanvas =
    document.querySelector(
      "#qrcode canvas"
    );

  if(qrCanvas){

    const qrSize = 700;

    const x =
      (width-qrSize)/2;

    const y = 780;

    ctx.drawImage(
      qrCanvas,
      x,
      y,
      qrSize,
      qrSize
    );

  }


  return canvas;

}


/* ==============================
   保存
   ============================== */

async function saveDigitalCard(){

  const canvas =
    createSaveCanvas();

  canvas.toBlob(
    async blob=>{

      if(!blob){

        alert(
          "画像を作成できませんでした。"
        );

        return;

      }


      const file =
        new File(
          [blob],
          "デジタル診察券.png",
          {
            type:"image/png"
          }
        );


      /*
       * iPhone / Android対応
       * Web Share APIが使える場合は
       * 端末の共有・写真保存画面へ渡す
       */

      if(
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({
          files:[file]
        })
      ){

        try{

          await navigator.share({
            files:[file],
            title:
              "デジタル診察券"
          });

          return;

        }
        catch(e){

          console.log(
            "share cancelled:",
            e
          );

        }

      }


      /*
       * Web Share非対応端末
       * PNGを直接ダウンロード
       */

      const url =
        URL.createObjectURL(
          blob
        );

      const a =
        document.createElement(
          "a"
        );

      a.href = url;

      a.download =
        "デジタル診察券.png";

      document
        .body
        .appendChild(a);

      a.click();

      a.remove();

      setTimeout(
        ()=>{
          URL.revokeObjectURL(url);
        },
        3000
      );

    },
    "image/png"
  );

}
