<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>デジタル診察券</title>

  <!-- Tesseract.js -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        "Yu Gothic",
        YuGothic,
        sans-serif;

      background: #f7f7f7;
      color: #333;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 32px 20px;
      background: #ffffff;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin: 20px 0 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 40px;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 24px 20px;
      text-align: center;
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .description {
      font-size: 14px;
      line-height: 1.7;
      color: #666;
      margin-bottom: 24px;
    }

    button {
      display: block;
      width: 100%;
      padding: 16px;
      margin-top: 12px;

      border: none;
      border-radius: 10px;

      background: #06c755;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .preview {
      display: none;
      margin-top: 24px;
    }

    .preview img {
      width: 100%;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    .ocr-status {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      background: #f3f3f3;

      font-size: 14px;
      line-height: 1.6;
    }

    .result {
      display: none;
      margin-top: 20px;
      text-align: left;
    }

    .result-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    #ocrText {
      width: 100%;
      min-height: 180px;

      padding: 12px;

      border: 1px solid #ddd;
      border-radius: 8px;

      background: #fafafa;

      font-size: 14px;
      line-height: 1.7;

      white-space: pre-wrap;
    }

    #cameraInput {
      display: none;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>デジタル診察券</h1>

    <div class="subtitle">
      綱島ゆめみ産婦人科
    </div>

    <section class="card">

      <div class="card-title">
        診察券を撮影してください
      </div>

      <div class="description">
        診察券を明るい場所で撮影してください。
      </div>

      <button
        type="button"
        onclick="openCamera()">
        診察券を撮影する
      </button>

      <input
        id="cameraInput"
        type="file"
        accept="image/*"
        capture="environment"
        onchange="showPreview(event)">

      <div id="preview" class="preview">

        <img
          id="previewImage"
          alt="撮影した診察券">

        <button
          id="ocrButton"
          type="button"
          onclick="runOCR()">
          OCRを開始する
        </button>

      </div>

      <div
        id="ocrStatus"
        class="ocr-status"
        style="display:none;">
      </div>

      <div
        id="result"
        class="result">

        <div class="result-title">
          OCR読み取り結果
        </div>

        <div id="ocrText"></div>

      </div>

    </section>

  </main>

  <script>

    let selectedFile = null;

    function openCamera() {

      document
        .getElementById("cameraInput")
        .click();

    }


    function showPreview(event) {

      const file = event.target.files[0];

      if (!file) {
        return;
      }

      selectedFile = file;

      const imageUrl =
        URL.createObjectURL(file);

      const previewImage =
        document.getElementById("previewImage");

      const preview =
        document.getElementById("preview");

      previewImage.src = imageUrl;

      preview.style.display = "block";

      document.getElementById("result")
        .style.display = "none";

      document.getElementById("ocrStatus")
        .style.display = "none";

    }


    async function runOCR() {

      if (!selectedFile) {
        alert("診察券を撮影してください。");
        return;
      }

      const button =
        document.getElementById("ocrButton");

      const status =
        document.getElementById("ocrStatus");

      const result =
        document.getElementById("result");

      const ocrText =
        document.getElementById("ocrText");


      button.disabled = true;

      result.style.display = "none";

      status.style.display = "block";

      status.textContent =
        "OCRの準備をしています…\n" +
        "初回は日本語のOCRデータを読み込むため、少し時間がかかります。";


      try {

        const worker =
          await Tesseract.createWorker(
            "jpn",
            1,
            {
              logger: function(message) {

                if (message.status) {

                  let percent = "";

                  if (typeof message.progress === "number") {

                    percent =
                      " " +
                      Math.round(message.progress * 100) +
                      "%";

                  }

                  status.textContent =
                    "OCR処理中…\n" +
                    message.status +
                    percent;

                }

              }
            }
          );


        status.textContent =
          "診察券の文字を読み取っています…";


        const resultData =
          await worker.recognize(selectedFile);


        const text =
          resultData.data.text;


        await worker.terminate();


        if (!text || !text.trim()) {

          ocrText.textContent =
            "文字を読み取ることができませんでした。\n" +
            "診察券を明るい場所で、文字がはっきり写るように撮影して再度お試しください。";

        } else {

          ocrText.textContent = text;

        }


        result.style.display = "block";

        status.textContent =
          "OCRが完了しました。";


      } catch (error) {

        console.error(error);

        status.textContent =
          "OCRでエラーが発生しました。";

        ocrText.textContent =
          "エラー内容：" +
          error.message;

        result.style.display = "block";

      }


      button.disabled = false;

    }

  </script>

</body>
</html>
