<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>デジタル診察券｜綱島ゆめみ産婦人科</title>

  <!-- QRコード読み取り -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <!-- 日本語OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <!-- QRコード生成 -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #f5f5f5;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        sans-serif;
      color: #333;
      background: #f5f5f5;
    }

    .container {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding:
        max(24px, env(safe-area-inset-top))
        16px
        max(40px, env(safe-area-inset-bottom));
      background: #fff;
    }

    h1 {
      margin: 12px 0 5px;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
    }

    .subtitle {
      margin-bottom: 25px;
      text-align: center;
      color: #666;
      font-size: 14px;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 20px 16px;
      background: #fff;
    }

    .description {
      margin-bottom: 20px;
      text-align: center;
      color: #666;
      font-size: 14px;
      line-height: 1.7;
    }

    button {
      width: 100%;
      min-height: 52px;
      margin-top: 10px;
      padding: 14px 16px;
      border: 0;
      border-radius: 10px;
      background: #06c755;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:active {
      opacity: 0.85;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .secondary {
      background: #555;
    }

    .blue {
      background: #1677ff;
    }

    .danger {
      background: #d32f2f;
    }

    #cameraInput {
      display: none;
    }

    #preview {
      display: none;
      margin-top: 20px;
    }

    #previewImage {
      display: block;
      width: 100%;
      max-height: 60vh;
      object-fit: contain;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fafafa;
    }

    #status {
      display: none;
      margin-top: 16px;
      padding: 13px;
      border-radius: 10px;
      background: #f3f3f3;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    #status.error {
      background: #fff0f0;
      color: #b00020;
      border: 1px solid #f0c0c0;
    }

    #result {
      display: none;
      margin-top: 20px;
    }

    .result-box {
      margin-top: 12px;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fff;
    }

    .label {
      margin-bottom: 7px;
      color: #666;
      font-size: 13px;
    }

    .value {
      font-size: 24px;
      font-weight: 700;
      word-break: break-all;
    }

    #patientName {
      font-size: 21px;
    }

    .edit-input {
      width: 100%;
      min-height: 50px;
      padding: 10px 12px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 20px;
      outline: none;
    }

    .edit-input:focus {
      border-color: #1677ff;
      box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.12);
    }

    .edit-note {
      margin-top: 7px;
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 270px;
      margin-top: 14px;
      padding: 14px;
      background: #fff;
    }

    #qrcode img,
    #qrcode canvas {
      width: 240px !important;
      height: 240px !important;
    }

    .note {
      margin-top: 10px;
      text-align: center;
      color: #777;
      font-size: 12px;
      line-height: 1.6;
    }

    .privacy {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #f7f7f7;
      color: #666;
      font-size: 12px;
      line-height: 1.6;
    }

    .hidden {
      display: none !important;
    }

    .loading {
      display: inline-block;
      margin-right: 5px;
    }

    .button-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .button-row button {
      flex: 1;
      margin-top: 0;
    }

    @media (max-width: 360px) {
      h1 {
        font-size: 21px;
      }

      .value {
        font-size: 21px;
      }

      #patientName {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

<main class="container">

  <h1>デジタル診察券</h1>

  <div class="subtitle">
    綱島ゆめみ産婦人科
  </div>

  <section class="card">

    <div class="description">
      診察券を明るい場所で撮影してください。<br>
      診察券全体が画面に入るようにすると、読み取りやすくなります。
    </div>

    <button type="button" onclick="openCamera()">
      診察券を撮影する
    </button>

    <input
      id="cameraInput"
      type="file"
      accept="image/*"
      capture="environment"
      onchange="handlePhoto(event)"
    >

    <!-- 撮影画像 -->
    <div id="preview">

      <img
        id="previewImage"
        alt="撮影した診察券"
      >

      <button
        id="processButton"
        type="button"
        onclick="processCard()"
      >
        診察券を読み取る
      </button>

    </div>

    <!-- ステータス -->
    <div id="status"></div>

    <!-- 結果 -->
    <div id="result">

      <!-- 診察券番号 -->
      <div class="result-box">

        <div class="label">
          診察券番号
        </div>

        <input
          id="cardNumber"
          class="edit-input"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          maxlength="30"
          placeholder="診察券番号"
          oninput="onCardNumberInput()"
        >

        <div class="edit-note">
          読み取り結果を確認してください。
          間違っている場合は数字を修正できます。
        </div>

      </div>

      <!-- 氏名 -->
      <div class="result-box">

        <div class="label">
          氏名
        </div>

        <input
          id="patientName"
          class="edit-input"
          type="text"
          autocomplete="off"
          placeholder="氏名"
        >

        <div class="edit-note">
          OCR結果を確認してください。
          間違っている場合は修正できます。
        </div>

      </div>

      <!-- QR -->
      <div class="result-box">

        <div class="label">
          診察券番号QRコード
        </div>

        <div id="qrcode"></div>

        <div class="note">
          診察券番号の数字のみを格納しています。<br>
          エラー訂正レベル：H（最高）
        </div>

        <button
          type="button"
          class="blue"
          onclick="regenerateQRCode()"
        >
          修正した番号でQRコードを更新
        </button>

      </div>

      <button
        type="button"
        class="secondary"
        onclick="resetAll()"
      >
        最初からやり直す
      </button>

    </div>

    <div class="privacy">
      <strong>個人情報について</strong><br>
      このページでは、撮影した診察券画像をGoogle Cloudなどの
      サーバーへ送信する処理は行っていません。
      QRコード読み取りとOCRは、基本的にこの端末のブラウザ上で処理します。
    </div>

  </section>

</main>


<script>

"use strict";

let selectedFile = null;


/* =========================================================
   基本UI
========================================================= */

function openCamera() {

  document.getElementById("cameraInput").click();

}


function handlePhoto(event) {

  const file = event.target.files && event.target.files[0];

  if (!file) {
    return;
  }

  selectedFile = file;

  const previewImage =
    document.getElementById("previewImage");

  const oldUrl =
    previewImage.dataset.objectUrl;

  if (oldUrl) {
    URL.revokeObjectURL(oldUrl);
  }

  const url = URL.createObjectURL(file);

  previewImage.src = url;
  previewImage.dataset.objectUrl = url;

  document.getElementById("preview").style.display = "block";

  document.getElementById("result").style.display = "none";

  hideStatus();

}


function setStatus(message, isError = false) {

  const el = document.getElementById("status");

  el.style.display = "block";

  el.className = isError ? "error" : "";

  el.textContent = message;

}


function hideStatus() {

  const el = document.getElementById("status");

  el.style.display = "none";

  el.className = "";

  el.textContent = "";

}


/* =========================================================
   数字処理
========================================================= */

function normalizeDigits(text) {

  return String(text || "")
    .replace(/[０-９]/g, function(ch) {
      return String.fromCharCode(ch.charCodeAt(0) - 0xfee0);
    })
    .replace(/[^0-9]/g, "");

}


function onCardNumberInput() {

  const input =
    document.getElementById("cardNumber");

  const digits =
    normalizeDigits(input.value);

  input.value = digits;

}


function getCardNumber() {

  return normalizeDigits(
    document.getElementById("cardNumber").value
  );

}


/* =========================================================
   画像読み込み
========================================================= */

function loadImage(file) {

  return new Promise(function(resolve, reject) {

    const img = new Image();

    const url = URL.createObjectURL(file);

    img.onload = function() {

      URL.revokeObjectURL(url);

      resolve(img);

    };

    img.onerror = function() {

      URL.revokeObjectURL(url);

      reject(
        new Error("画像を読み込めませんでした。")
      );

    };

    img.src = url;

  });

}


/* =========================================================
   Canvas
========================================================= */

function canvasFromImage(img, maxSide = 2200) {

  const width =
    img.naturalWidth || img.width;

  const height =
    img.naturalHeight || img.height;

  const scale =
    Math.min(
      1,
      maxSide / Math.max(width, height)
    );

  const canvas =
    document.createElement("canvas");

  canvas.width =
    Math.max(1, Math.round(width * scale));

  canvas.height =
    Math.max(1, Math.round(height * scale));

  const ctx =
    canvas.getContext(
      "2d",
      { willReadFrequently: true }
    );

  ctx.imageSmoothingEnabled = true;

  ctx.imageSmoothingQuality = "high";

  ctx.drawImage(
    img,
    0,
    0,
    canvas.width,
    canvas.height
  );

  return canvas;

}


/* =========================================================
   回転
========================================================= */

function rotateCanvas(source, angle) {

  if (angle === 0) {
    return source;
  }

  const rad =
    angle * Math.PI / 180;

  const swap =
    angle === 90 || angle === 270;

  const canvas =
    document.createElement("canvas");

  canvas.width =
    swap ? source.height : source.width;

  canvas.height =
    swap ? source.width : source.height;

  const ctx =
    canvas.getContext(
      "2d",
      { willReadFrequently: true }
    );

  ctx.translate(
    canvas.width / 2,
    canvas.height / 2
  );

  ctx.rotate(rad);

  ctx.drawImage(
    source,
    -source.width / 2,
    -source.height / 2
  );

  return canvas;

}


/* =========================================================
   画像前処理
========================================================= */

function makeProcessedCanvas(source, mode) {

  const canvas =
    document.createElement("canvas");

  canvas.width = source.width;
  canvas.height = source.height;

  const ctx =
    canvas.getContext(
      "2d",
      { willReadFrequently: true }
    );

  ctx.drawImage(source, 0, 0);

  const imageData =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

  const data = imageData.data;

  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {

    const gray =
      0.299 * data[i] +
      0.587 * data[i + 1] +
      0.114 * data[i + 2];

    if (mode === "gray") {

      data[i] = gray;
      data[i + 1] = gray;
      data[i + 2] = gray;

    }

    else if (mode === "contrast") {

      const v =
        Math.max(
          0,
          Math.min(
            255,
            (gray - 128) * 1.8 + 128
          )
        );

      data[i] = v;
      data[i + 1] = v;
      data[i + 2] = v;

    }

    else if (mode === "threshold") {

      const v =
        gray >= 150 ? 255 : 0;

      data[i] = v;
      data[i + 1] = v;
      data[i + 2] = v;

    }

  }

  ctx.putImageData(imageData, 0, 0);

  return canvas;

}


/* =========================================================
   QR探索用バリエーション
========================================================= */

function makeVariants(source) {

  const variants = [];

  const angles = [0, 90, 180, 270];

  for (const angle of angles) {

    const rotated =
      rotateCanvas(source, angle);

    variants.push({
      canvas: rotated,
      label: `回転${angle}°・全体`
    });

    const w = rotated.width;
    const h = rotated.height;

    /*
      全体だけではQRが小さすぎる場合があるため、
      画像を部分的に拡大して検索する。
    */

    const crops = [

      [0, 0, w, h, "全体"],

      [0, 0, w * 0.75, h * 0.75, "左上"],

      [w * 0.25, 0, w, h * 0.75, "右上"],

      [0, h * 0.25, w * 0.75, h, "左下"],

      [w * 0.25, h * 0.25, w, h, "右下"],

      [w * 0.125, h * 0.125, w * 0.875, h * 0.875, "中央"]

    ];

    for (const crop of crops) {

      const [
        x1,
        y1,
        x2,
        y2,
        label
      ] = crop;

      if (label === "全体") {
        continue;
      }

      const cw =
        Math.max(
          1,
          Math.round(x2 - x1)
        );

      const ch =
        Math.max(
          1,
          Math.round(y2 - y1)
        );

      const canvas =
        document.createElement("canvas");

      canvas.width = cw;
      canvas.height = ch;

      const ctx =
        canvas.getContext(
          "2d",
          { willReadFrequently: true }
        );

      ctx.drawImage(
        rotated,
        x1,
        y1,
        cw,
        ch,
        0,
        0,
        cw,
        ch
      );

      variants.push({
        canvas: canvas,
        label:
          `回転${angle}°・${label}`
      });

    }

  }

  return variants;

}


/* =========================================================
   jsQR
========================================================= */

function scanOneCanvas(canvas) {

  const modes = [
    "normal",
    "gray",
    "contrast",
    "threshold"
  ];

  for (const mode of modes) {

    const target =
      mode === "normal"
        ? canvas
        : makeProcessedCanvas(
            canvas,
            mode
          );

    const ctx =
      target.getContext(
        "2d",
        { willReadFrequently: true }
      );

    const imageData =
      ctx.getImageData(
        0,
        0,
        target.width,
        target.height
      );

    const code =
      jsQR(
        imageData.data,
        imageData.width,
        imageData.height,
        {
          inversionAttempts:
            "attemptBoth"
        }
      );

    if (code) {

      return {
        code: code,
        canvas: target
      };

    }

  }

  return null;

}


/* =========================================================
   QR読み取り
========================================================= */

async function scanQRCode(img) {

  const base =
    canvasFromImage(img, 2200);

  const variants =
    makeVariants(base);

  let count = 0;

  for (const variant of variants) {

    count++;

    setStatus(
      "QRコードを探しています…\n" +
      `${count} / ${variants.length}\n` +
      variant.label
    );

    const result =
      scanOneCanvas(
        variant.canvas
      );

    if (result) {

      return {
        data: result.code.data,
        code: result.code,
        canvas: result.canvas
      };

    }

    /*
      UI更新のため少しだけブラウザへ処理を返す
    */
    await new Promise(
      resolve => setTimeout(resolve, 0)
    );

  }

  return null;

}


/* =========================================================
   氏名領域
========================================================= */

function cropNameArea(canvas, qr) {

  const points =
    qr.location;

  const tl =
    points.topLeftCorner;

  const tr =
    points.topRightCorner;

  const bl =
    points.bottomLeftCorner;

  const br =
    points.bottomRightCorner;

  const qrWidth =
    Math.max(
      Math.hypot(
        tr.x - tl.x,
        tr.y - tl.y
      ),
      Math.hypot(
        br.x - bl.x,
        br.y - bl.y
      )
    );

  /*
    診察券のレイアウトに合わせた候補領域。

    QRの右側～下側を広めに切り出す。
  */

  const qrRight =
    Math.max(
      tl.x,
      tr.x,
      bl.x,
      br.x
    );

  const qrBottom =
    Math.max(
      tl.y,
      tr.y,
      bl.y,
      br.y
    );

  const x =
    Math.max(
      0,
      Math.round(
        qrRight + qrWidth * 0.1
      )
    );

  const y =
    Math.max(
      0,
      Math.round(
        qrBottom + qrWidth * 0.05
      )
    );

  let width =
    Math.round(
      qrWidth * 3.5
    );

  let height =
    Math.round(
      qrWidth * 1.5
    );

  width =
    Math.min(
      width,
      canvas.width - x
    );

  height =
    Math.min(
      height,
      canvas.height - y
    );

  if (
    width < 100 ||
    height < 60
  ) {

    throw new Error(
      "氏名領域を検出できませんでした。"
    );

  }

  const output =
    document.createElement("canvas");

  output.width = width;
  output.height = height;

  const ctx =
    output.getContext(
      "2d",
      { willReadFrequently: true }
    );

  ctx.drawImage(
    canvas,
    x,
    y,
    width,
    height,
    0,
    0,
    width,
    height
  );

  return output;

}


/* =========================================================
   OCR用画像
========================================================= */

function preprocessNameCanvas(source) {

  const scale = 4;

  const output =
    document.createElement("canvas");

  output.width =
    source.width * scale;

  output.height =
    source.height * scale;

  const ctx =
    output.getContext(
      "2d",
      { willReadFrequently: true }
    );

  ctx.imageSmoothingEnabled = true;

  ctx.imageSmoothingQuality = "high";

  ctx.drawImage(
    source,
    0,
    0,
    output.width,
    output.height
  );

  return output;

}


/* =========================================================
   OCR文字整理
========================================================= */

function cleanName(text) {

  let name =
    String(text || "")
      .replace(/\r/g, "\n")
      .split("\n")
      .map(
        s => s.trim()
      )
      .filter(Boolean)
      .join(" ");

  /*
    数字・不要な記号を除去
  */

  name =
    name
      .replace(/[0-9０-９]/g, "")
      .replace(
        /[|｜_＿~～「」『』]/g,
        ""
      )
      .replace(
        /\s+/g,
        " "
      )
      .trim();

  return name;

}


/* =========================================================
   OCR
========================================================= */

async function recognizeName(canvas) {

  let worker = null;

  try {

    setStatus(
      "氏名をOCRで読み取っています…\n" +
      "少し時間がかかる場合があります。"
    );

    worker =
      await Tesseract.createWorker(
        "jpn",
        1,
        {
          logger: function(message) {

            if (!message.status) {
              return;
            }

            let progress = "";

            if (
              typeof message.progress ===
              "number"
            ) {

              progress =
                " " +
                Math.round(
                  message.progress * 100
                ) +
                "%";

            }

            setStatus(
              "氏名をOCRで読み取っています…\n" +
              message.status +
              progress
            );

          }
        }
      );

    await worker.setParameters({
      tessedit_pageseg_mode: "7"
    });

    const result =
      await worker.recognize(canvas);

    return cleanName(
      result.data.text
    );

  }

  catch (error) {

    console.error(
      "OCR error:",
      error
    );

    return "";

  }

  finally {

    if (worker) {

      try {
        await worker.terminate();
      }
      catch (e) {
        console.warn(e);
      }

    }

  }

}


/* =========================================================
   QRコード生成
========================================================= */

function generateQRCode(cardNumber) {

  const target =
    document.getElementById(
      "qrcode"
    );

  target.innerHTML = "";

  if (!cardNumber) {
    return;
  }

  new QRCode(
    target,
    {
      text: cardNumber,

      width: 240,

      height: 240,

      colorDark: "#000000",

      colorLight: "#ffffff",

      correctLevel:
        QRCode.CorrectLevel.H
    }
  );

}


/* =========================================================
   QR再生成
========================================================= */

function regenerateQRCode() {

  const cardNumber =
    getCardNumber();

  if (!cardNumber) {

    alert(
      "診察券番号を入力してください。"
    );

    return;

  }

  document.getElementById(
    "cardNumber"
  ).value = cardNumber;

  generateQRCode(
    cardNumber
  );

  setStatus(
    "QRコードを更新しました。\n" +
    "診察券番号：" +
    cardNumber
  );

}


/* =========================================================
   メイン処理
========================================================= */

async function processCard() {

  if (!selectedFile) {

    alert(
      "診察券を撮影してください。"
    );

    return;

  }

  const button =
    document.getElementById(
      "processButton"
    );

  button.disabled = true;

  document.getElementById(
    "result"
  ).style.display = "none";

  try {

    /* -----------------------------------------
       画像読み込み
    ----------------------------------------- */

    setStatus(
      "診察券の画像を読み込んでいます…"
    );

    const img =
      await loadImage(
        selectedFile
      );

    /* -----------------------------------------
       QR
    ----------------------------------------- */

    setStatus(
      "QRコードを探しています…\n" +
      "診察券の向きを自動的に確認します。"
    );

    const qrResult =
      await scanQRCode(img);

    if (!qrResult) {

      throw new Error(
        "診察券のQRコードを読み取れませんでした。\n\n" +
        "・明るい場所で撮影してください。\n" +
        "・診察券全体を写してください。\n" +
        "・QRコードが小さくなりすぎないようにしてください。\n" +
        "・QRコードに反射や指がかからないようにしてください。"
      );

    }

    /* -----------------------------------------
       診察券番号
    ----------------------------------------- */

    const cardNumber =
      normalizeDigits(
        qrResult.data
      );

    if (!cardNumber) {

      throw new Error(
        "QRコードは検出できましたが、" +
        "診察券番号を数字として取得できませんでした。"
      );

    }

    document.getElementById(
      "cardNumber"
    ).value = cardNumber;

    setStatus(
      "診察券番号を取得しました。\n\n" +
      "番号：" +
      cardNumber +
      "\n\n" +
      "氏名を読み取っています…"
    );

    /* -----------------------------------------
       氏名OCR
    ----------------------------------------- */

    let patientName = "";

    if (
      qrResult.code &&
      qrResult.canvas
    ) {

      try {

        const nameArea =
          cropNameArea(
            qrResult.canvas,
            qrResult.code
          );

        const processed =
          preprocessNameCanvas(
            nameArea
          );

        patientName =
          await recognizeName(
            processed
          );

      }

      catch (error) {

        console.error(
          "Name OCR:",
          error
        );

      }

    }

    /* -----------------------------------------
       氏名表示
    ----------------------------------------- */

    document.getElementById(
      "patientName"
    ).value =
      patientName || "";

    /* -----------------------------------------
       QR生成
    ----------------------------------------- */

    generateQRCode(
      cardNumber
    );

    /* -----------------------------------------
       結果表示
    ----------------------------------------- */

    document.getElementById(
      "result"
    ).style.display = "block";

    if (patientName) {

      setStatus(
        "読み取りが完了しました。\n\n" +
        "診察券番号：" +
        cardNumber +
        "\n" +
        "氏名：" +
        patientName +
        "\n\n" +
        "内容を確認してください。"
      );

    }
    else {

      setStatus(
        "診察券番号の読み取りが完了しました。\n\n" +
        "診察券番号：" +
        cardNumber +
        "\n\n" +
        "氏名は自動認識できませんでした。\n" +
        "氏名欄に手入力してください。"
      );

    }

  }

  catch (error) {

    console.error(
      error
    );

    setStatus(
      error.message ||
      "読み取り中にエラーが発生しました。",
      true
    );

  }

  finally {

    button.disabled = false;

  }

}


/* =========================================================
   リセット
========================================================= */

function resetAll() {

  selectedFile = null;

  const input =
    document.getElementById(
      "cameraInput"
    );

  input.value = "";

  const previewImage =
    document.getElementById(
      "previewImage"
    );

  const oldUrl =
    previewImage.dataset.objectUrl;

  if (oldUrl) {

    URL.revokeObjectURL(
      oldUrl
    );

    delete previewImage.dataset.objectUrl;

  }

  previewImage.removeAttribute(
    "src"
  );

  document.getElementById(
    "preview"
  ).style.display = "none";

  document.getElementById(
    "result"
  ).style.display = "none";

  document.getElementById(
    "cardNumber"
  ).value = "";

  document.getElementById(
    "patientName"
  ).value = "";

  document.getElementById(
    "qrcode"
  ).innerHTML = "";

  hideStatus();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================================================
   ページ終了時
========================================================= */

window.addEventListener(
  "beforeunload",
  function() {

    const previewImage =
      document.getElementById(
        "previewImage"
      );

    const url =
      previewImage.dataset.objectUrl;

    if (url) {
      URL.revokeObjectURL(url);
    }

  }
);

</script>
