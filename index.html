<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デジタル診察券</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP",
                   "Yu Gothic", YuGothic, sans-serif;
      background: #f7f7f7;
      color: #333;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 32px 20px;
      background: #ffffff;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin: 20px 0 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 40px;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 24px 20px;
      text-align: center;
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .description {
      font-size: 14px;
      line-height: 1.7;
      color: #666;
      margin-bottom: 24px;
    }

    .camera-button {
      display: block;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #06c755;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .camera-button:active {
      opacity: 0.8;
    }

    .preview {
      display: none;
      margin-top: 24px;
    }

    .preview img {
      width: 100%;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    .preview-text {
      margin-top: 12px;
      font-size: 14px;
      color: #666;
    }

    #cameraInput {
      display: none;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>デジタル診察券</h1>

    <div class="subtitle">
      綱島ゆめみ産婦人科
    </div>

    <section class="card">

      <div class="card-title">
        診察券を撮影してください
      </div>

      <div class="description">
        診察券を明るい場所で撮影してください。
      </div>

      <button
        type="button"
        class="camera-button"
        onclick="openCamera()">
        診察券を撮影する
      </button>

      <input
        id="cameraInput"
        type="file"
        accept="image/*"
        capture="environment"
        onchange="showPreview(event)">

      <div id="preview" class="preview">
        <img id="previewImage" alt="撮影した診察券">
        <div class="preview-text">
          撮影した画像を確認してください。
        </div>
      </div>

    </section>

  </main>

  <script>
    function openCamera() {
      document.getElementById("cameraInput").click();
    }

    function showPreview(event) {
      const file = event.target.files[0];

      if (!file) {
        return;
      }

      const imageUrl = URL.createObjectURL(file);

      const previewImage = document.getElementById("previewImage");
      const preview = document.getElementById("preview");

      previewImage.src = imageUrl;
      preview.style.display = "block";
    }
  </script>

</body>
</html>
